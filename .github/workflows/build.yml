name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  plugin_test:
    name: asdf plugin test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      # stringer is built from source: the plugin needs a Go that can build the tested version.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false
      - name: asdf_plugin_test
        uses: asdf-vm/actions/plugin-test@v4
        with:
          version: 0.49.0
          command: stringer -help

  bats:
    name: bats
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false
      - uses: asdf-vm/actions/setup@v4
      - name: Install bats
        run: |
          if command -v brew >/dev/null && [ "$RUNNER_OS" = "macOS" ]; then
            brew install bats-core
          else
            sudo apt-get update && sudo apt-get install -y bats
          fi
      - run: bats test
